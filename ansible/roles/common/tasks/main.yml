---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags:
    - common

- name: Install base prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ufw
      - python3
      - python3-apt
    state: present
  tags:
    - common

- name: Set system timezone
  community.general.timezone:
    name: "{{ timezone }}"
  tags:
    - common
