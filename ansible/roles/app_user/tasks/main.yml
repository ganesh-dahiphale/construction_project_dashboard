---
- name: Ensure docker group exists
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present
    system: true
  tags:
    - user

- name: Create application deployment system user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    groups:
      - "{{ app_group }}"
    append: true
    shell: /bin/bash
    home: "{{ app_dir }}"
    create_home: false
    system: true
    password_lock: true
    state: present
  tags:
    - user
