<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found - Construction Progress Dashboard</title>
    <!-- Bootstrap 5 CSS & Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center py-5">

<div class="container text-center" style="max-width: 540px;">
    <div class="card border-0 shadow-sm p-4 p-md-5 bg-white rounded-4">
        <div class="text-warning mb-3">
            <i class="bi bi-cone-striped display-1"></i>
        </div>
        <h1 class="h2 fw-bold text-dark mb-2">404 - Resource Not Found</h1>
        <p class="text-muted mb-4" th:text="${message != null ? message : 'The construction record, task ID, or page you requested does not exist or has been moved.'}">
            The resource you requested does not exist.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/}" class="btn btn-warning fw-semibold px-4">
                <i class="bi bi-house-door me-1"></i>Return Home
            </a>
            <a th:href="@{/tasks}" class="btn btn-outline-secondary px-3">
                <i class="bi bi-list-task me-1"></i>View Tasks
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
