<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${project.id == null ? 'New Project' : 'Edit Project'} + ' - Construction Progress Dashboard'">Project Form</title>
    <!-- Bootstrap 5 CSS & Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Global Navigation -->
<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<main class="container my-4 flex-grow-1">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Home</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/projects}" class="text-decoration-none">Projects</a></li>
            <li class="breadcrumb-item active fw-semibold" aria-current="page" th:text="${project.id == null ? 'New Project' : 'Edit Project #' + project.id}">Project Form</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card border-0 shadow-sm bg-white">
                <div class="card-header bg-white py-3 border-bottom">
                    <h1 class="h4 fw-bold mb-0 text-dark d-flex align-items-center gap-2">
                        <i class="bi bi-folder-plus text-warning" th:if="${project.id == null}"></i>
                        <i class="bi bi-pencil-square text-warning" th:unless="${project.id == null}"></i>
                        <span th:text="${project.id == null ? 'Register New Project Site' : 'Edit Project Definition'}">Project Form</span>
                    </h1>
                </div>

                <div class="card-body p-4">

                    <form th:action="${project.id == null ? '/admin/projects' : '/admin/projects/' + project.id + '/edit'}"
                          th:object="${project}" method="post" class="needs-validation" novalidate>

                        <!-- Project Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Project Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   placeholder="e.g., Downtown Metro Station"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''}" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                Project name is required.
                            </div>
                        </div>

                        <!-- Location -->
                        <div class="mb-3">
                            <label for="location" class="form-label fw-semibold">Site Location</label>
                            <input type="text" class="form-control" id="location" th:field="*{location}"
                                   placeholder="e.g., Sector 4 North Crossing"
                                   th:classappend="${#fields.hasErrors('location')} ? 'is-invalid' : ''}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('location')}" th:errors="*{location}">
                                Invalid location.
                            </div>
                        </div>

                        <!-- Dates Row -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="startDate" class="form-label fw-semibold">Mobilization / Start Date</label>
                                <input type="date" class="form-control" id="startDate" th:field="*{startDate}">
                            </div>
                            <div class="col-md-6">
                                <label for="endDate" class="form-label fw-semibold">Target Completion Date</label>
                                <input type="date" class="form-control" id="endDate" th:field="*{endDate}">
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a th:href="@{/admin/projects}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-warning fw-semibold px-4 shadow-sm" id="saveProjectBtn">
                                <i class="bi bi-check2-circle me-1"></i>Save Project
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

<footer class="bg-white border-top py-3 mt-auto">
    <div class="container text-center text-muted small">
        Construction Progress Dashboard &copy; 2026 &bull; Project Administration
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
