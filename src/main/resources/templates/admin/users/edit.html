<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Edit User - Construction Progress Dashboard</title>
    <!-- Bootstrap 5 CSS & Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Global Navigation -->
<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<main class="container my-4 flex-grow-1" style="max-width: 640px;">

    <!-- Flash Error Alert -->
    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show mb-4 shadow-sm" role="alert" data-testid="flash-error">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">Error occurred.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Card -->
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
            <h5 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
                <i class="bi bi-pencil-square text-primary"></i>
                <span>Edit User: <code th:text="${targetUser.username}">username</code></span>
            </h5>
            <a th:href="@{/admin/users}" class="btn btn-outline-secondary btn-sm" data-testid="edit-cancel-btn">
                <i class="bi bi-arrow-left me-1"></i>Back to Users
            </a>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/users/{id}(id=${targetUser.id})}" th:object="${user}" method="post" novalidate>

                <!-- Full Name -->
                <div class="mb-3">
                    <label for="fullName" class="form-label small fw-semibold text-muted">Full Name <span class="text-danger">*</span></label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                           placeholder="Full Name" required data-testid="edit-fullname-input">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" data-testid="error-fullname">
                        Full name error
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-muted">Email Address <span class="text-danger">*</span></label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           placeholder="email@example.com" required data-testid="edit-email-input">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" data-testid="error-email">
                        Email error
                    </div>
                </div>

                <!-- Role Selection (ENGINEER or MANAGER) -->
                <div class="mb-4">
                    <label for="role" class="form-label small fw-semibold text-muted">Role Assignment <span class="text-danger">*</span></label>
                    <select id="role" th:field="*{role}" class="form-select"
                            th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''"
                            required data-testid="edit-role-select">
                        <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.displayName}">Site Engineer</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}" data-testid="error-role">
                        Role error
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/users}" class="btn btn-outline-secondary px-3" data-testid="edit-cancel-btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-semibold px-4 shadow-sm" data-testid="edit-submit-btn">
                        <i class="bi bi-save me-1"></i>Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
