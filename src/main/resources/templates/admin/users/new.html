<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Register New User - Construction Progress Dashboard</title>
    <!-- Bootstrap 5 CSS & Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Global Navigation -->
<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<main class="container my-4 flex-grow-1" style="max-width: 640px;">

    <!-- Flash Error Alert -->
    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show mb-4 shadow-sm" role="alert" data-testid="flash-error">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">Error occurred.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Card -->
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
            <h5 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
                <i class="bi bi-person-plus-fill text-warning"></i>
                <span>Register New Staff Member</span>
            </h5>
            <a th:href="@{/admin/users}" class="btn btn-outline-secondary btn-sm" data-testid="user-cancel-btn">
                <i class="bi bi-arrow-left me-1"></i>Back to Users
            </a>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/users}" th:object="${user}" method="post" novalidate>

                <!-- Full Name -->
                <div class="mb-3">
                    <label for="fullName" class="form-label small fw-semibold text-muted">Full Name <span class="text-danger">*</span></label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                           placeholder="e.g. Rahul Sharma" required data-testid="user-fullname-input">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" data-testid="error-fullname">
                        Full name error
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-muted">Email Address <span class="text-danger">*</span></label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           placeholder="e.g. rahul.sharma@construction.local" required data-testid="user-email-input">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" data-testid="error-email">
                        Email error
                    </div>
                </div>

                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-muted">Username <span class="text-danger">*</span></label>
                    <input type="text" id="username" th:field="*{username}" class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                           placeholder="3-30 chars (letters, digits, ., _, -)" required data-testid="user-username-input">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}" data-testid="error-username">
                        Username error
                    </div>
                </div>

                <!-- Role Selection (No ADMIN role available) -->
                <div class="mb-3">
                    <label for="role" class="form-label small fw-semibold text-muted">Role Assignment <span class="text-danger">*</span></label>
                    <select id="role" th:field="*{role}" class="form-select"
                            th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''"
                            required data-testid="user-role-select">
                        <option value="">-- Select Staff Role --</option>
                        <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.displayName}">Site Engineer</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}" data-testid="error-role">
                        Role error
                    </div>
                    <div class="form-text small text-muted">
                        <i class="bi bi-info-circle me-1"></i>Administrator roles cannot be provisioned through this interface.
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-muted">Password <span class="text-danger">*</span></label>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           placeholder="Min 8 characters, at least 1 letter and 1 digit" required data-testid="user-password-input">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}" data-testid="error-password">
                        Password error
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label small fw-semibold text-muted">Confirm Password <span class="text-danger">*</span></label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                           placeholder="Re-enter password" required data-testid="user-confirm-password-input">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" data-testid="error-confirmpassword">
                        Confirm password error
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/users}" class="btn btn-outline-secondary px-3" data-testid="user-cancel-btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-warning fw-semibold px-4 shadow-sm" data-testid="user-submit-btn">
                        <i class="bi bi-person-check-fill me-1"></i>Register User
                    </button>
                </div>
            </form>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
