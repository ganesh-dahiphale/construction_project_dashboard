<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Construction Progress Dashboard</title>
    <!-- Bootstrap 5 CSS & Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        .login-card {
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container" style="max-width: 460px;">

    <!-- Logo & Header -->
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-warning text-dark rounded-circle p-3 mb-3 shadow">
            <i class="bi bi-building-gear fs-1"></i>
        </div>
        <h1 class="h3 fw-bold text-white mb-1">Construction Progress</h1>
        <p class="text-white-50 small mb-0">Sign in with your role-based credentials</p>
    </div>

    <!-- Login Form Card -->
    <div class="card login-card border-0 p-4 p-md-5 bg-white">

        <!-- Error Message Alert -->
        <div th:if="${errorMessage != null}" class="alert alert-danger d-flex align-items-center gap-2 mb-3 py-2 small" role="alert" id="loginErrorAlert">
            <i class="bi bi-exclamation-octagon-fill text-danger"></i>
            <span th:text="${errorMessage}">Invalid username or password.</span>
        </div>

        <!-- Logout Message Alert -->
        <div th:if="${logoutMessage != null}" class="alert alert-success d-flex align-items-center gap-2 mb-3 py-2 small" role="alert" id="loginLogoutAlert">
            <i class="bi bi-check-circle-fill text-success"></i>
            <span th:text="${logoutMessage}">Logged out successfully.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <!-- Username Input -->
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-muted">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="admin, manager, or engineer" required autofocus>
                </div>
            </div>

            <!-- Password Input -->
            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="••••••••" required>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold shadow-sm mb-3" id="loginSubmitBtn">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
            </button>
        </form>

        <!-- Dev Credentials Info Box -->
        <div class="bg-light rounded-3 p-3 mt-2 border">
            <h2 class="h6 fw-bold mb-2 text-dark d-flex align-items-center gap-1">
                <i class="bi bi-key text-warning"></i>
                <span>Development Logins</span>
            </h2>
            <ul class="list-unstyled small mb-0 text-muted">
                <li>&bull; <code>admin</code> / <code>admin123</code> (Admin)</li>
                <li>&bull; <code>manager</code> / <code>manager123</code> (Manager)</li>
                <li>&bull; <code>engineer</code> / <code>engineer123</code> (Engineer)</li>
            </ul>
        </div>
    </div>

    <!-- Footer link to health -->
    <div class="text-center mt-3">
        <a th:href="@{/health}" class="text-white-50 small text-decoration-none">
            <i class="bi bi-heart-pulse me-1"></i>System Health Endpoint
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
