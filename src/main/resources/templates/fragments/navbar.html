<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}" data-testid="nav-brand">
            <i class="bi bi-building-gear text-warning"></i>
            <span>Construction Progress Dashboard</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'home' ? 'active' : ''}" th:href="@{/}" data-testid="nav-home">Home</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'MANAGER')">
                    <a class="nav-link" th:classappend="${activeTab == 'dashboard' ? 'active' : ''}" th:href="@{/dashboard}" data-testid="nav-dashboard">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'tasks' ? 'active' : ''}" th:href="@{/tasks}" data-testid="nav-tasks">Tasks</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'MANAGER')">
                    <a class="nav-link" th:classappend="${activeTab == 'status' ? 'active' : ''}" th:href="@{/status}" data-testid="nav-status">Status</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'MANAGER')">
                    <a class="nav-link" th:classappend="${activeTab == 'alerts' ? 'active' : ''}" th:href="@{/alerts}" data-testid="nav-alerts">Alerts</a>
                </li>
                <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                    <a class="btn btn-warning btn-sm fw-semibold" th:href="@{/tasks/new}" data-testid="nav-add-task">
                        <i class="bi bi-plus-circle me-1"></i>Add Task
                    </a>
                </li>
                <li class="nav-item dropdown ms-lg-2 mt-2 mt-lg-0" sec:authorize="hasRole('ADMIN')" data-testid="nav-admin-section">
                    <a class="btn btn-outline-info btn-sm fw-semibold dropdown-toggle" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" data-testid="admin-dropdown-btn">
                        Admin
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow" aria-labelledby="adminDropdown">
                        <li><a class="dropdown-item" th:href="@{/admin/projects}" data-testid="nav-projects">Manage Projects</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/users}" data-testid="nav-users">Users</a></li>
                    </ul>
                </li>
                <li class="nav-item ms-lg-3 mt-2 mt-lg-0" sec:authorize="isAuthenticated()">
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-secondary text-light px-2 py-1" data-testid="current-user-badge">
                            <i class="bi bi-person-circle text-warning me-1"></i>
                            <span sec:authentication="name">User</span>
                        </span>
                        <form th:action="@{/logout}" method="post" class="d-inline m-0">
                            <button type="submit" class="btn btn-outline-danger btn-sm py-1 px-2" title="Logout" data-testid="logout-btn">
                                <i class="bi bi-box-arrow-right me-1"></i>Logout
                            </button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
