<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-building-gear text-warning"></i>
            <span>Construction Progress Dashboard</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'home' ? 'active' : ''}" th:href="@{/}">
                        <i class="bi bi-house-door me-1"></i>Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'dashboard' ? 'active' : ''}" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'tasks' ? 'active' : ''}" th:href="@{/tasks}">
                        <i class="bi bi-list-task me-1"></i>Tasks
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'status' ? 'active' : ''}" th:href="@{/status}">
                        <i class="bi bi-diagram-3 me-1"></i>Status
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'alerts' ? 'active' : ''}" th:href="@{/alerts}">
                        <i class="bi bi-bell me-1"></i>Alerts
                    </a>
                </li>
                <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                    <a class="btn btn-warning btn-sm fw-semibold" th:href="@{/tasks/new}">
                        <i class="bi bi-plus-circle me-1"></i>Add Task
                    </a>
                </li>
                <li class="nav-item ms-lg-2 mt-2 mt-lg-0" sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-outline-info btn-sm fw-semibold" th:href="@{/admin/projects}">
                        <i class="bi bi-gear-wide-connected me-1"></i>Admin
                    </a>
                </li>
                <li class="nav-item ms-lg-3 mt-2 mt-lg-0" sec:authorize="isAuthenticated()">
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-secondary text-light px-2 py-1">
                            <i class="bi bi-person-circle text-warning me-1"></i>
                            <span sec:authentication="name">User</span>
                        </span>
                        <form th:action="@{/logout}" method="post" class="d-inline m-0">
                            <button type="submit" class="btn btn-outline-danger btn-sm py-1 px-2" title="Logout">
                                <i class="bi bi-box-arrow-right me-1"></i>Logout
                            </button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
