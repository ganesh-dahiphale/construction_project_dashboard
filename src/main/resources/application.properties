# ===================================================================
# Construction Progress Dashboard - Application Configuration
# Configuration externalized via environment variables with defaults
# ===================================================================

# Application Info
spring.application.name=${APP_NAME:construction-progress-dashboard}
app.version=${APP_VERSION:dev}

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/}

# Database Configuration (Defaults to file-based H2 database for persistent storage)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/dashboard;AUTO_SERVER=false}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Development Only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}
spring.h2.console.settings.web-allow-others=false

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
